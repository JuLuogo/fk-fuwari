name: Encrypt post

# 由 Pages CMS 文章编辑页的「加密这篇文章」按钮触发（workflow_dispatch，payload 里带文章路径和密码）。
# 做的事：用主题管线渲染正文 -> AES-256-GCM 加密 -> 提交密文 -> 触发一次发布构建。
# 明文正文保留在仓库里（按你的要求），密码只在本次运行中使用，不落盘、不提交。
on:
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS payload as JSON
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: encrypt-post
  cancel-in-progress: false

jobs:
  encrypt:
    name: 加密文章
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 读取 Pages CMS 传来的文章与密码
        id: params
        env:
          PAYLOAD: ${{ inputs.payload }}
          TMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            let p = {};
            try {
              p = JSON.parse(process.env.PAYLOAD || "{}");
            } catch (e) {
              console.error("payload 不是合法 JSON");
              process.exit(1);
            }
            const prefix = "src/content/posts/";
            const filePath = String((p.context && p.context.path) || "");
            let slug = filePath.startsWith(prefix) ? filePath.slice(prefix.length) : "";
            if (slug.endsWith(".mdx")) slug = slug.slice(0, -4);
            else if (slug.endsWith(".md")) slug = slug.slice(0, -3);
            if (!slug) {
              console.error("payload 里没有文章路径，请从文章编辑页触发");
              process.exit(1);
            }
            const dir = process.env.TMP || "/tmp";
            fs.writeFileSync(path.join(dir, "post-slug"), slug);
            fs.writeFileSync(path.join(dir, "post-password"), String((p.inputs && p.inputs.password) || ""));
            console.log("目标文章: " + slug);
          '
          echo "slug=$(cat "$TMP/post-slug")" >> "$GITHUB_OUTPUT"

      - name: 加密（PBKDF2 + AES-256-GCM）
        env:
          TMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          password="$(cat "$TMP/post-password" 2>/dev/null || true)"
          rm -f "$TMP/post-password"
          if [ -z "$password" ]; then
            echo "::error::没有提供密码，请在这个动作的密码字段里填写"
            exit 1
          fi
          echo "::add-mask::$password"
          LOCK_POST_PASSWORD="$password" pnpm lock-post "${{ steps.params.outputs.slug }}"

      - name: 提交密文
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有需要提交的改动（密文可能已经是最新的）"
            exit 0
          fi
          git commit -m "chore: 加密文章 ${{ steps.params.outputs.slug }}"
          git push

      - name: 触发发布构建
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -sS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/pages-build.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "已触发发布构建（Build and publish）"
